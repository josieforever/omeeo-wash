name: omeeowash
description: "Lundri is an on-demand laundry marketplace that automatically matches customer orders with available laundry partners and riders for pickup, processing, payment, and delivery."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  font_awesome_flutter: ^10.7.0
  http: ^1.4.0
  url_launcher: ^6.3.0
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.9
  cloud_functions: ^5.5.2
  firebase_app_check: ^0.3.2+7
  firebase_storage: ^12.4.7
  firebase_database: ^11.3.7
  google_sign_in: ^6.2.1
  google_maps_flutter: ^2.13.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_places_flutter: ^2.0.7
  flutter_typeahead: ^5.2.0
  push: ^3.3.3
  lottie: ^3.3.1
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1
  flutter_svg: ^2.0.7
  intl: 0.20.2
  image_picker: ^1.0.4
  carousel_slider: ^4.2.1
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  file_picker: ^10.3.3
  bubble: ^1.2.1
  isar: ^3.1.0+1
  path_provider: ^2.1.5
  isar_flutter_libs: ^3.1.0+1
  video_player: ^2.10.0
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1
  fluttertoast: ^9.0.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.5.0
  connectivity_plus: ^7.0.0
  emoji_picker_flutter: ^4.4.0
  geoflutterfire_plus: ^0.0.32

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.5
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/lundri_icon.png"

  adaptive_icon_foreground: "assets/images/lundri_icon.png"
  adaptive_icon_background: "#FFF7F0"

flutter_native_splash:
  color: "#FFF7F0"

  android: true
  ios: true
  web: false

  android_12:
    color: "#FFF7F0"
    image: assets/images/splash_blank.png
    icon_background_color: "#FFF7F0"

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
